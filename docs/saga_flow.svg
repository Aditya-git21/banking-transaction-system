<svg width="680" height="620" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Banking Saga Pattern - Happy and Failure Paths</title>
  <desc>Flowchart showing AWS Step Functions Saga pattern with happy path and failure path with automatic rollback</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="620" fill="#0f0f11" rx="12"/>

  <!-- Title -->
  <text x="340" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#e8e6df" font-family="Segoe UI, sans-serif">Saga Pattern — How a Transaction Flows</text>

  <!-- Legend -->
  <rect x="200" y="46" width="12" height="12" rx="2" fill="#1D9E75"/>
  <text x="218" y="57" font-size="11" fill="#6b6a63" font-family="Segoe UI, sans-serif">Happy path</text>
  <rect x="310" y="46" width="12" height="12" rx="2" fill="#D85A30"/>
  <text x="328" y="57" font-size="11" fill="#6b6a63" font-family="Segoe UI, sans-serif">Failure path</text>

  <!-- START -->
  <rect x="255" y="74" width="170" height="38" rx="19" fill="#2a2a32" stroke="#44444e" stroke-width="0.8"/>
  <text x="340" y="93" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#e8e6df" font-family="Segoe UI, sans-serif">Start transaction</text>

  <line x1="340" y1="112" x2="340" y2="136" stroke="#44444e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step Functions -->
  <rect x="200" y="136" width="280" height="54" rx="10" fill="#2a2435" stroke="#6b5fad" stroke-width="0.8"/>
  <text x="340" y="156" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#b8b0f0" font-family="Segoe UI, sans-serif">AWS Step Functions</text>
  <text x="340" y="175" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#7a74b8" font-family="Segoe UI, sans-serif">Saga orchestrator</text>

  <line x1="340" y1="190" x2="340" y2="214" stroke="#44444e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DEBIT -->
  <rect x="200" y="214" width="280" height="54" rx="10" fill="#1a2e2a" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="340" y="234" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#5dcaa5" font-family="Segoe UI, sans-serif">Lambda: Debit</text>
  <text x="340" y="253" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#3a7a65" font-family="Segoe UI, sans-serif">Deduct from sender</text>

  <line x1="340" y1="268" x2="340" y2="292" stroke="#44444e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CREDIT -->
  <rect x="200" y="292" width="280" height="54" rx="10" fill="#1a2e2a" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="340" y="312" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#5dcaa5" font-family="Segoe UI, sans-serif">Lambda: Credit</text>
  <text x="340" y="331" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#3a7a65" font-family="Segoe UI, sans-serif">Add to receiver</text>

  <!-- SUCCESS path -->
  <path d="M480 319 L545 319 L545 472" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.85"/>
  <text x="552" y="312" font-size="11" fill="#1D9E75" font-family="Segoe UI, sans-serif">credit ok</text>

  <!-- FAILURE path -->
  <path d="M200 319 L135 319 L135 382" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.85"/>
  <text x="55" y="312" font-size="11" fill="#D85A30" font-family="Segoe UI, sans-serif">credit fails</text>

  <!-- ROLLBACK -->
  <rect x="38" y="382" width="194" height="54" rx="10" fill="#2d1e18" stroke="#D85A30" stroke-width="0.8"/>
  <text x="135" y="402" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#f0997b" font-family="Segoe UI, sans-serif">Lambda: Rollback</text>
  <text x="135" y="421" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#9a5535" font-family="Segoe UI, sans-serif">Reverse the debit</text>

  <line x1="135" y1="436" x2="135" y2="472" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.85"/>

  <!-- FAIL outcome -->
  <rect x="38" y="472" width="194" height="42" rx="21" fill="#2a1515" stroke="#a32d2d" stroke-width="0.8"/>
  <text x="135" y="493" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#f09595" font-family="Segoe UI, sans-serif">Transaction failed</text>
  <text x="135" y="526" text-anchor="middle" font-size="11" fill="#7a3535" font-family="Segoe UI, sans-serif">Money safely returned</text>

  <!-- SUCCESS outcome -->
  <rect x="448" y="472" width="194" height="42" rx="21" fill="#14261a" stroke="#3B6D11" stroke-width="0.8"/>
  <text x="545" y="493" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#97c459" font-family="Segoe UI, sans-serif">Transaction success</text>
  <text x="545" y="526" text-anchor="middle" font-size="11" fill="#3B6D11" font-family="Segoe UI, sans-serif">Zero data loss</text>

  <!-- Idempotency note -->
  <rect x="178" y="558" width="324" height="28" rx="6" fill="none" stroke="#2a2a30" stroke-width="0.8"/>
  <text x="340" y="576" text-anchor="middle" font-size="11" fill="#5a5a54" font-family="Segoe UI, sans-serif">Idempotency keys prevent duplicate transactions</text>
</svg>
